<head>
  <title>Tech test</title>
  <link rel="stylesheet" type="text/css" href="https://www.x3dom.org/download/1.8.3/x3dom.css">
  <script type="text/javascript" src="https://www.x3dom.org/download/1.8.3/x3dom.js"></script>
  <script type="text/javascript" src="/x3dom-patch.js"></script>
  <style>
    .banner {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
      padding: 10px 18px; border-radius: 12px; text-align: center;
      font: 600 18px/1.3 system-ui, sans-serif; color: #fff;
      background: rgba(20, 20, 20, 0.75); pointer-events: none;
    }
    .banner .hint { font-weight: 400; font-size: 13px; opacity: 0.8; }
    .banner .dot { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; vertical-align: -0.05em; }
  </style>
</head>

<body>
  {{> world}}
</body>

<template name="world">
  <div class="banner">
    <div>
      {{#if status.color}}<span class="dot" style="background: {{status.color}}"></span>{{/if}}
      {{status.text}}
    </div>
    <div class="hint">{{status.hint}}</div>
  </div>

  <x3d>
    <scene>
      <!-- Cameras: keys 1, 2, 3 switch between them (front, top, side) -->
      <viewpoint id="view-front" position="0 -16.4 14.5" orientation="1 0 0 0.96"
                 centerOfRotation="0 0 3" fieldOfView="0.785398"></viewpoint>
      <viewpoint id="view-top" position="0 0 24" centerOfRotation="0 0 3" fieldOfView="0.785398"></viewpoint>
      <viewpoint id="view-side" position="16.4 0 14.5" orientation="0.4192 0.4192 0.8053 1.7857"
                 centerOfRotation="0 0 3" fieldOfView="0.785398"></viewpoint>

      <!-- Sky, instead of the black beyond the floor when the view is tilted -->
      <background skyColor="0.82 0.88 0.88"></background>

      <!-- Floor -->
      <transform id="floor">
        <shape>
          <appearance>
            <material diffuseColor="#4A9"></material>
          </appearance>
          <plane center='0,0,-0.5' size="400 400"></plane>
        </shape>
      </transform>

      <!-- Grid: 7x7 cells on the floor and the edges of the 7x7x7 volume -->
      <shape isPickable="false">
        <appearance>
          <material emissiveColor="1 1 1"></material>
        </appearance>
        <indexedLineSet coordIndex="{{grid.coordIndex}}">
          <coordinate point="{{grid.point}}"></coordinate>
        </indexedLineSet>
      </shape>

      <!-- Playable floor cells: next to a cube, in my color, on my turn -->
      {{#each cells}}
        <transform translation="{{x}} {{y}} -0.48">
          <shape isPickable="false">
            <appearance>
              <material diffuseColor="{{color}}" transparency="0.55"></material>
            </appearance>
            <plane size="0.9 0.9"></plane>
          </shape>
        </transform>
      {{/each}}

      <!-- Cubes: the red starting cube, then the moves stored in "cubes" -->
      {{#each cubes}}
        <transform class="cube" translation="{{x}} {{y}} {{z}}">
          <shape>
            <appearance>
              <material diffuseColor="{{color}}" transparency="{{fade}}"></material>
            </appearance>
            <box size="1 1 1"></box>
          </shape>
        </transform>
      {{/each}}

      <!-- Outline of the last move -->
      {{#with last}}
        <transform translation="{{x}} {{y}} {{z}}">
          <shape isPickable="false">
            <appearance>
              <material emissiveColor="1 1 1"></material>
            </appearance>
            <indexedLineSet coordIndex="{{outline.coordIndex}}">
              <coordinate point="{{outline.point}}"></coordinate>
            </indexedLineSet>
          </shape>
        </transform>
      {{/with}}

      <!-- Preview: where my cube would land, under the mouse -->
      {{#with preview}}
        <transform translation="{{x}} {{y}} {{z}}">
          <shape isPickable="false">
            <appearance>
              <material diffuseColor="{{color}}" transparency="0.5"></material>
            </appearance>
            <box size="0.98 0.98 0.98"></box>
          </shape>
        </transform>
      {{/with}}
    </scene>
  </x3d>
</template>
