<head>
  <title>Tech test</title>
  <link rel="stylesheet" type="text/css" href="https://www.x3dom.org/download/1.8.3/x3dom.css">
  <script type="text/javascript" src="https://www.x3dom.org/download/1.8.3/x3dom.js"></script>
  <script type="text/javascript" src="/x3dom-patch.js"></script>
</head>

<body>
  {{> world}}
</body>

<template name="world">
  <x3d>
    <scene>
      <!-- Camera: moved by main.js so the whole stack stays in view -->
      <viewpoint id="camera" position="0 0 10" centerOfRotation="0 0 0" fieldOfView="0.785398"></viewpoint>

      <!-- Floor -->
      <transform id="floor">
        <shape>
          <appearance>
            <material diffuseColor="#4A9"></material>
          </appearance>
          <plane center='0,0,-0.5' size="50 50"></plane>
        </shape>
      </transform>

      <!-- Red cube: base of the stack -->
      <transform id="red-cube" translation="0 0 0">
        <shape>
          <appearance>
            <material diffuseColor="1 0 0"></material>
          </appearance>
          <box size="1 1 1"></box>
        </shape>
      </transform>

      <!-- Stack of cubes, stored in the "cubes" collection -->
      {{#each cubes}}
        <transform class="stack-cube" translation="0 {{y}} 0">
          <shape>
            <appearance>
              <material diffuseColor="{{color}}"></material>
            </appearance>
            <box size="1 1 1"></box>
          </shape>
        </transform>
      {{/each}}
    </scene>
  </x3d>
</template>
